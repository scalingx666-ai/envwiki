[project]
name = "envwiki"
version = "0.1.0"
description = "A toolbox for agents that build Harbor tasks: recipes, staging and scaffolding over MCP."
readme = "readme.en.md"
# zvec, the vector store behind the recipe index, ships wheels for
# CPython 3.10 to 3.14 only.
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "pypdf>=4.3",
    # Harbor's own TaskConfig needs toml when it is used from a source checkout.
    "toml>=0.10.2",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
# Vector retrieval for recipe matching (zvec). Without it envwiki falls back to
# the built-in lexical matcher.
vector = ["zvec>=0.8.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
envwiki = "envwiki.cli:main"
envwiki-mcp = "envwiki.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envwiki"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer declares options as function call defaults, which B008 always flags.
"src/envwiki/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
